<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rchat Desktop</title>
    <style>
      :root {
        --bg: #0e1621;
        --accent: #2aabee;
        --text: #f5f5f5;
        --text-dim: #8696a8;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
      }
      .boot-splash {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: radial-gradient(
            ellipse 80% 50% at 50% 35%,
            rgba(42, 171, 238, 0.14),
            transparent 70%
          ),
          var(--bg);
      }
      .boot-splash-mark {
        position: relative;
        width: 88px;
        height: 88px;
        display: grid;
        place-items: center;
      }
      .boot-splash-letter {
        position: relative;
        z-index: 1;
        width: 72px;
        height: 72px;
        border-radius: 22px;
        display: grid;
        place-items: center;
        font-size: 36px;
        font-weight: 700;
        letter-spacing: -0.04em;
        color: #fff;
        background: linear-gradient(145deg, var(--accent), #1a7eb8);
        box-shadow: 0 12px 32px rgba(42, 171, 238, 0.35),
          inset 0 1px 0 rgba(255, 255, 255, 0.2);
        animation: boot-mark-breathe 1.8s ease-in-out infinite;
      }
      .boot-splash-ring {
        position: absolute;
        inset: 0;
        border-radius: 26px;
        border: 2px solid rgba(42, 171, 238, 0.55);
        animation: boot-ring-pulse 1.8s ease-out infinite;
        pointer-events: none;
      }
      .boot-splash-brand {
        font-size: 22px;
        font-weight: 650;
        letter-spacing: -0.02em;
      }
      .boot-splash-label {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--text-dim);
        font-size: 13px;
      }
      .boot-splash-dots {
        display: inline-flex;
        gap: 4px;
      }
      .boot-splash-dots i {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--accent);
        opacity: 0.35;
        animation: boot-dot 1.2s ease-in-out infinite;
      }
      .boot-splash-dots i:nth-child(2) {
        animation-delay: 0.15s;
      }
      .boot-splash-dots i:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes boot-mark-breathe {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.04);
        }
      }
      @keyframes boot-ring-pulse {
        0% {
          transform: scale(0.92);
          opacity: 0.7;
        }
        70%,
        100% {
          transform: scale(1.18);
          opacity: 0;
        }
      }
      @keyframes boot-dot {
        0%,
        80%,
        100% {
          opacity: 0.3;
          transform: translateY(0);
        }
        40% {
          opacity: 1;
          transform: translateY(-2px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash-letter,
        .boot-splash-ring,
        .boot-splash-dots i {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="boot-splash" role="status" aria-live="polite" aria-busy="true">
      <div class="boot-splash-mark" aria-hidden="true">
        <span class="boot-splash-letter">R</span>
        <span class="boot-splash-ring"></span>
      </div>
      <div class="boot-splash-brand">Rchat</div>
      <div class="boot-splash-label">
        <span class="boot-splash-dots" aria-hidden="true">
          <i></i><i></i><i></i>
        </span>
        <span>Starting Rchat</span>
      </div>
    </div>
  </body>
</html>
