services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qchat
      POSTGRES_PASSWORD: qchat
      POSTGRES_DB: qchat
    ports:
      - "5432:5432"
    volumes:
      - qchat_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qchat"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: qchatminio
      MINIO_ROOT_PASSWORD: qchatminio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - qchat_minio:/data

  nats:
    image: nats:2-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"

volumes:
  qchat_pg:
  qchat_minio:
