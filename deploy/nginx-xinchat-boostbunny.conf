# XinChat on xinchat.boostbunny.io (include from nginx-qchat.conf).
# DNS: xinchat A → VPS IP. TLS: certbot --nginx -d xinchat.boostbunny.io
#       (or expand: certbot certonly --nginx -d rchat.boostbunny.io -d xinchat.boostbunny.io --expand)
#
# App URL: https://xinchat.boostbunny.io/xin/  (basePath /xin; root redirects to /xin/)

server {
    listen 80;
    listen [::]:80;
    server_name xinchat.boostbunny.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xinchat.boostbunny.io;

    ssl_certificate /etc/letsencrypt/live/rchat.boostbunny.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rchat.boostbunny.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 210m;

    location ~ ^/v1/auth/(login|register|captcha) {
        limit_req zone=qchat_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v1/ws {
        limit_req zone=qchat_ws burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /v1/ {
        limit_req zone=qchat_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    location = /metrics {
        return 404;
    }

    location = /admin {
        return 301 /admin/;
    }
    location ^~ /admin/ {
        alias /root/qchat/apps/admin/out/;
        index index.html;
        try_files $uri $uri.html $uri/ =404;
    }

    location = / {
        return 301 https://$host/xin/;
    }

    location = /xin {
        return 301 https://$host/xin/;
    }

    location ^~ /xin/ {
        alias /root/qchat/apps/xin-web/out/;
        index index.html;
        try_files $uri $uri.html $uri/ =404;
    }

    location = /xin/sw.js {
        alias /root/qchat/apps/xin-web/out/sw.js;
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/xin/";
    }

    location = /xin/manifest.webmanifest {
        alias /root/qchat/apps/xin-web/out/manifest.webmanifest;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location ^~ /xin-desktop-updates/ {
        alias /var/www/xin-desktop-updates/;
        autoindex off;
        add_header Cache-Control "no-cache";
        types {
            application/octet-stream exe AppImage deb dmg;
            text/yaml yml;
            application/json json;
        }
    }
}
