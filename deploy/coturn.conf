# Coturn for LiveKit remote TURN (dev defaults — change for production).
# LiveKit v1.8 uses username/credential; match deploy/livekit.yaml turn_servers.
listening-port=3478
fingerprint
lt-cred-mech
user=qchat:qchatturnsecret
realm=qchat.local
no-cli
no-tls
no-dtls
# Relay range must not overlap LiveKit rtc port_range (50000–50100).
min-port=49160
max-port=49200
listening-ip=0.0.0.0
relay-ip=0.0.0.0
log-file=stdout
simple-log
