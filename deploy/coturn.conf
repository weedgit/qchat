# Coturn for LiveKit remote TURN (dev defaults — change for production).
listening-port=3478
fingerprint
use-auth-secret
static-auth-secret=qchat-turn-static-secret-change-me
realm=qchat.local
no-cli
no-tls
no-dtls
# Relay range must not overlap LiveKit rtc port_range (50000–50100).
min-port=49160
max-port=49200
listening-ip=0.0.0.0
relay-ip=0.0.0.0
log-file=stdout
simple-log
