# Local LiveKit SFU (Phase 6 calls). Keys match API LIVEKIT_* defaults.
# LiveKit v1.8.x TURN entries use username/credential (not secret).
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: false
  node_ip: 127.0.0.1
  stun_servers:
    - stun:stun.l.google.com:19302
  turn_servers:
    - host: 127.0.0.1
      port: 3478
      protocol: udp
      username: qchat
      credential: qchatturnsecret
    - host: 127.0.0.1
      port: 3478
      protocol: tcp
      username: qchat
      credential: qchatturnsecret
keys:
  # Must be ≥32 chars for LiveKit secrets
  devkey: secret-that-is-at-least-32-characters-long
logging:
  level: info
