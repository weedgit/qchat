# Rate limiting (Mattermost RateLimitSettings at the edge).
# Auth is stricter to blunt credential stuffing; general API is milder.
limit_req_zone $binary_remote_addr zone=qchat_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=qchat_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=qchat_ws:10m rate=10r/m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Shared app root + API proxy (included conceptually in both HTTP and HTTPS).
# HTTP → HTTPS redirect (mic/camera need a secure context).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# Qchat web + API over TLS
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /root/qchat/deploy/certs/qchat.crt;
    ssl_certificate_key /root/qchat/deploy/certs/qchat.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /root/qchat/apps/web/out;
    index index.html;

    client_max_body_size 50m;

    # Login / register / captcha / OTP — tight per-IP limit
    location ~ ^/v1/auth/(login|register|captcha) {
        limit_req zone=qchat_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket endpoint -> Go backend
    location /v1/ws {
        limit_req zone=qchat_ws burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # REST API -> Go backend
    location /v1/ {
        limit_req zone=qchat_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check -> Go backend (no rate limit)
    location = /healthz {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    # Metrics should stay off the public vhost in production (bind localhost only on API).
    location = /metrics {
        return 404;
    }

    # Static Next.js export
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # PWA metadata and worker must revalidate so deployments activate promptly.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}

# LiveKit signaling over WSS (HTTPS pages cannot use ws:// — mixed content).
# RTC media still uses LiveKit UDP/TCP ports 50000-50100 / 7881 on the host IP.
server {
    listen 7443 ssl;
    listen [::]:7443 ssl;
    server_name _;

    ssl_certificate     /root/qchat/deploy/certs/qchat.crt;
    ssl_certificate_key /root/qchat/deploy/certs/qchat.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
