# Rate limiting (RateLimitSettings at the edge).
# Auth is stricter to blunt credential stuffing; general API is milder.
limit_req_zone $binary_remote_addr zone=qchat_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=qchat_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=qchat_ws:10m rate=10r/m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Gzip types for JS/CSS live in /etc/nginx/nginx.conf (http context).

# Shared app root + API proxy (included conceptually in both HTTP and HTTPS).
# HTTP → HTTPS redirect (mic/camera need a secure context).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# Qchat web + API over TLS
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /root/qchat/deploy/certs/qchat.crt;
    ssl_certificate_key /root/qchat/deploy/certs/qchat.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /root/qchat/apps/web/out;
    index index.html;

    client_max_body_size 210m;

    # Login / register / captcha / OTP — tight per-IP limit
    location ~ ^/v1/auth/(login|register|captcha) {
        limit_req zone=qchat_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket endpoint -> Go backend
    location /v1/ws {
        limit_req zone=qchat_ws burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # REST API -> Go backend
    location /v1/ {
        limit_req zone=qchat_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check -> Go backend (no rate limit)
    location = /healthz {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    # Metrics should stay off the public vhost in production (bind localhost only on API).
    location = /metrics {
        return 404;
    }

    # Admin console (static Next.js export with basePath /admin)
    # Use ^~ so this wins over location /. Avoid alias+try_files SPA fallback bugs.
    location = /admin {
        return 301 /admin/;
    }
    location ^~ /admin/ {
        alias /root/qchat/apps/admin/out/;
        index index.html;
        try_files $uri $uri.html $uri/ =404;
    }

    # Static Next.js export (web chat)
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # PWA metadata and worker must revalidate so deployments activate promptly.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Desktop auto-update feed (electron-builder generic provider).
    # Host latest*.yml + installers under /var/www/qchat-desktop-updates/.
    # Clients set updateUrl / QCHAT_UPDATE_URL to https://<host>/desktop-updates
    location ^~ /desktop-updates/ {
        alias /var/www/qchat-desktop-updates/;
        autoindex off;
        add_header Cache-Control "no-cache";
        types {
            application/octet-stream exe AppImage deb dmg;
            text/yaml yml;
            application/json json;
        }
    }

    # Client installers served by the download page (`apps/web/public/downloads`).
    # Prefer copying binaries onto the host after build; see public/downloads/README.md.
    location ^~ /downloads/ {
        # When web root already contains public/downloads from the Next export,
        # this falls through via the general location /. Keep this block if you
        # mount a separate volume for large installers:
        # alias /var/www/qchat-downloads/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
        types {
            application/octet-stream exe AppImage deb dmg apk;
            application/json json;
            image/png png;
            image/jpeg jpg jpeg;
            image/webp webp;
            text/markdown md;
        }
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}

# LiveKit signaling over WSS (HTTPS pages cannot use ws:// — mixed content).
# RTC media still uses LiveKit UDP/TCP ports 50000-50100 / 7881 on the host IP.
server {
    listen 7443 ssl http2;
    listen [::]:7443 ssl http2;
    server_name _;

    ssl_certificate     /root/qchat/deploy/certs/qchat.crt;
    ssl_certificate_key /root/qchat/deploy/certs/qchat.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
